version: 1
jobs:
  issue-fixer:
    name: Issue fixer
    skill: .agents/skills/issue-fixer/SKILL.md
    schedule: "0 7 * * 1-5"
    timezone: UTC
    history: 5
    open_pull_request: true
    # Hands an issue that needs a person back to the maintainers.
    hand_back:
      remove: [fix-approved]
      add: [needs-design]
    requires:
      mcps:
        - binding: github
          tools:
            - list_issues
            - issue_read
            - search_pull_requests
            - pull_request_read
