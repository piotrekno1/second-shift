version: 1
jobs:
  issue-fixer:
    name: Issue fixer
    skill: .agents/skills/issue-fixer/SKILL.md
    schedule: "0 7 * * 1-5"
    timezone: UTC
    history: 5
    open_pull_request: true
    # The label a maintainer adds to approve an issue for a fix, and the one
    # an issue gets when the fixer hands it back to a person.
    approved_issues:
      label: fix-approved
      hand_back: needs-design
    requires:
      mcps:
        - binding: github
          tools:
            - list_issues
            - issue_read
            - search_pull_requests
            - pull_request_read
