version: 1
jobs:
  ticket-reconciliation:
    name: Reconcile implemented tickets
    skill: .agents/skills/ticket-reconciliation/SKILL.md
    schedule: 0 9 * * 1-5
    timezone: UTC
    requires:
      mcps:
      - binding: github
        tools:
        - list_commits
        - get_commit
        - search_pull_requests
        - pull_request_read
