# Standalone example. See docs/production-deployment.md.
name: secondshift

x-application: &application
  image: ${SECONDSHIFT_IMAGE:?Set SECONDSHIFT_IMAGE in deploy/production/compose.env}
  restart: unless-stopped

x-artifacts: &artifacts
  SECONDSHIFT_ARTIFACT_STORAGE: ${ARTIFACT_STORAGE:-s3}
  SECONDSHIFT_ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-}
  SECONDSHIFT_ARTIFACT_REGION: ${ARTIFACT_REGION:-}
  SECONDSHIFT_ARTIFACT_ACCESS_KEY_ID: ${ARTIFACT_ACCESS_KEY_ID:-}
  SECONDSHIFT_ARTIFACT_SECRET_ACCESS_KEY: ${ARTIFACT_SECRET_ACCESS_KEY:-}
  SECONDSHIFT_ARTIFACT_ENDPOINT_URL: ${ARTIFACT_ENDPOINT_URL:-}
  SECONDSHIFT_ARTIFACT_ROOT: /var/lib/secondshift/artifacts
  SECONDSHIFT_ARTIFACT_ADDRESSING_STYLE: ${ARTIFACT_ADDRESSING_STYLE:-auto}

# Agents call the runner's relay through the egress proxy's forward, the same
# way on every runner. The worker collects their tool calls from the runner,
# so nothing on the agents network reaches the control plane.
x-agents: &agents
  SECONDSHIFT_AGENT_IMAGE: ${AGENT_IMAGE:-}
  SECONDSHIFT_AGENT_BROKER_URL: http://${AGENT_PROXY_ADDRESS:-172.30.0.3}:${RELAY_FORWARD_PORT:-8001}/gateway/agent/mcp

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
      RUNNER_DATABASE_PASSWORD: ${RUNNER_DATABASE_PASSWORD:?Set RUNNER_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/production/init-postgres.sql:/docker-entrypoint-initdb.d/10-secondshift.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    <<: *application
    env_file: ./deploy/production/web.env
    environment:
      <<: [*artifacts, *agents]
      SECONDSHIFT_DATABASE_URL: postgres://secondshift:${APP_DATABASE_PASSWORD:?}@postgres:5432/secondshift
      SECONDSHIFT_TRUSTED_PROXY_COUNT: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - artifacts:/var/lib/secondshift/artifacts
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8000/-/health/up/', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      retries: 10

  gateway:
    <<: *application
    env_file: ./deploy/production/gateway.env
    environment:
      <<: [*artifacts, *agents]
      # A separate key that may only read (s3:GetObject).
      SECONDSHIFT_ARTIFACT_ACCESS_KEY_ID: ${ARTIFACT_READ_ACCESS_KEY_ID:-}
      SECONDSHIFT_ARTIFACT_SECRET_ACCESS_KEY: ${ARTIFACT_READ_SECRET_ACCESS_KEY:-}
      SECONDSHIFT_DATABASE_URL: postgres://secondshift:${APP_DATABASE_PASSWORD:?}@postgres:5432/secondshift
    networks:
      default:
        aliases: [secondshift-gateway]
    volumes:
      - artifacts:/var/lib/secondshift/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 610s

  worker:
    <<: *application
    command: [python, manage.py, run_dbos_worker]
    env_file: ./deploy/production/worker.env
    environment:
      <<: [*artifacts, *agents]
      SECONDSHIFT_DATABASE_URL: postgres://secondshift:${APP_DATABASE_PASSWORD:?}@postgres:5432/secondshift
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
      runner:
        condition: service_started
    volumes:
      - artifacts:/var/lib/secondshift/artifacts
    stop_grace_period: 60s

  runner:
    <<: *application
    user: "0:0"
    env_file: ./deploy/production/runner.env
    environment:
      <<: *agents
      SECONDSHIFT_RUNNER_AGENT_RELAY_PORT: "8003"
      SECONDSHIFT_AGENT_NETWORK: ${AGENT_NETWORK:-secondshift_agents}
      SECONDSHIFT_AGENT_PROXY_ADDRESS: ${AGENT_PROXY_ADDRESS:-172.30.0.3}
      # Empty turns setup commands off. See setup-proxy below.
      SECONDSHIFT_RUNNER_SETUP_PROXY_ADDRESS: ${SETUP_PROXY_ADDRESS:-}
      SECONDSHIFT_RUNNER_SETUP_NETWORK: ${SETUP_NETWORK:-secondshift_setup}
      SECONDSHIFT_RUNNER_DATABASE_URL: postgres://secondshift_runner:${RUNNER_DATABASE_PASSWORD:?}@postgres:5432/secondshift_runner
      SECONDSHIFT_DATA_DIR: ${RUNNER_ROOT:?Set RUNNER_ROOT to an absolute host path}
      SECONDSHIFT_RUNNER_WORK_ROOT: ${RUNNER_ROOT:?}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The host daemon must see sandbox workspaces at the identical path.
      - type: bind
        source: ${RUNNER_ROOT:?}
        target: ${RUNNER_ROOT:?}
        bind:
          create_host_path: false
    networks:
      default:
        aliases: [secondshift-runner]
      relay: {}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 40s

  # Agents' only way out. It opens HTTPS tunnels to their providers, and
  # passes one port through to the runner's relay. It holds no secrets and
  # reaches nothing else.
  agent-proxy:
    <<: *application
    command:
      - python
      - -m
      - secondshift.agent.image.egress
      - --forward
      - ${RELAY_FORWARD_PORT:-8001}:runner:8003
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      agents:
        ipv4_address: ${AGENT_PROXY_ADDRESS:-172.30.0.3}
      relay: {}
      egress: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Setup commands' only way out. It opens HTTPS tunnels to package registries
  # only, never to the agents' providers. Off unless the setup profile is on
  # and SETUP_PROXY_ADDRESS is set.
  setup-proxy:
    <<: *application
    profiles: [setup]
    command: [python, -m, secondshift.agent.image.egress, --allow-registries]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      setup:
        ipv4_address: ${SETUP_PROXY_ADDRESS:-172.31.0.3}
      setup-egress: {}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

networks:
  # No route out. Agents reach the relay and the internet only through
  # agent-proxy. The runner refuses an agent network that isn't internal.
  agents:
    name: ${AGENT_NETWORK:-secondshift_agents}
    internal: true
    ipam:
      config:
        - subnet: ${AGENT_SUBNET:-172.30.0.0/24}
  # Only the runner and agent-proxy, for the relay forward.
  relay:
    internal: true
  # Only agent-proxy joins it, so the proxy can reach nothing else of ours.
  egress: {}
  # No route out. Setup containers reach the internet only through setup-proxy.
  setup:
    name: ${SETUP_NETWORK:-secondshift_setup}
    internal: true
    ipam:
      config:
        - subnet: ${SETUP_SUBNET:-172.31.0.0/24}
  # Only setup-proxy joins it.
  setup-egress: {}

volumes:
  artifacts:
  postgres_data:
  caddy_data:
  caddy_config:
