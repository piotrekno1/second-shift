[project]
name = "secondshift"
version = "0.1.0a2"
description = "Run repository agent skills safely, on schedule."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.15.0",
    "anyio>=4.15.1",
    "croniter>=6.0.0",
    "cryptography>=46.0.0",
    "dbos>=3.3.0",
    "django>=6.0,<6.1",
    "django-allauth>=65.0.0",
    "django-axes>=8.3.1",
    "django-click>=2.4.0",
    "django-cors-headers>=4.9.0",
    "django-encrypted-model-fields>=0.6.5",
    "django-environ>=0.13.0",
    "django-health-check>=4.8.0",
    "django-ninja>=1.5.0",
    "django-storages[s3]>=1.14.6",
    "genai-prices>=0.1.13",
    "gunicorn>=23.0.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "jsonschema>=4.26,<5",
    "mcp>=1.26,<2",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-ai-slim[anthropic,dbos,openai]>=2.57.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "uvicorn-worker>=0.4.0",
    "whitenoise>=6.11.0",
]

[project.scripts]
secondshift = "secondshift.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secondshift"]
exclude = ["secondshift/**/tests"]
# The built dashboard is gitignored but belongs in the wheel.
artifacts = ["secondshift/web"]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "pytest>=9.0.0",
    "pytest-django>=4.11.0",
    "ruff>=0.14.0",
    "time-machine>=2.16.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "secondshift.config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
line-length = 88
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "DTZ", "G", "LOG", "PLC0415", "UP", "RUF", "SIM", "C4"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
