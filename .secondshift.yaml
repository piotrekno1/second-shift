version: 1

jobs:
  # No schedule: this job runs only when started with Run now.
  repository-health:
    name: Repository health
    skill: .agents/skills/repository-health/SKILL.md
    notify:
      - binding: engineering-alerts
        required: false

  docs-drift:
    name: Documentation drift
    skill: examples/docs-drift/.agents/skills/docs-drift/SKILL.md
    schedule: "0 8 * * 1"
    timezone: UTC

  engineering-briefing:
    name: Monday engineering briefing
    skill: examples/engineering-briefing/.agents/skills/engineering-briefing/SKILL.md
    schedule: "0 9 * * 1"
    timezone: Europe/Warsaw
    requires:
      mcps:
        - binding: github
          tools:
            - search_pull_requests
            - pull_request_read
            - list_commits
            - get_commit
    notify:
      - binding: engineering-reports
        required: true
