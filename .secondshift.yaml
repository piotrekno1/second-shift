version: 1

jobs:
  # No schedule: choose Run now when preparing a release.
  release-readiness-review:
    name: Release readiness review
    skill: examples/release-readiness-review/.agents/skills/release-readiness-review/SKILL.md

  # No schedule: this job runs only when started with Run now.
  repository-health:
    name: Repository health
    skill: examples/repository-health/.agents/skills/repository-health/SKILL.md
    history: 1
    notify:
      - binding: engineering-alerts
        required: false

  docs-drift:
    name: Documentation drift
    skill: examples/docs-drift/.agents/skills/docs-drift/SKILL.md
    history: 1
    schedule: "0 8 * * 1"
    timezone: UTC

  engineering-briefing:
    name: Monday engineering briefing
    skill: examples/engineering-briefing/.agents/skills/engineering-briefing/SKILL.md
    schedule: "0 9 * * 1"
    timezone: Europe/Warsaw
    requires:
      mcps:
        - binding: github
          tools:
            - search_pull_requests
            - pull_request_read
            - list_commits
            - get_commit
    notify:
      - binding: engineering-reports
        required: true
