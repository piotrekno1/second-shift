version: 1

jobs:
  # No schedule: choose Run now when preparing a release.
  release-readiness-review:
    name: Release readiness review
    skill: examples/release-readiness-review/.agents/skills/release-readiness-review/SKILL.md

  # No schedule: this job runs only when started with Run now.
  repository-health:
    name: Repository health
    skill: examples/repository-health/.agents/skills/repository-health/SKILL.md
    history: 1
    notify:
      - binding: engineering-alerts
        required: false

  django-perf-review:
    name: Django performance review
    skill: examples/django-perf-review/.agents/skills/django-perf-review/SKILL.md

  django-access-review:
    name: Django access review
    skill: examples/django-access-review/.agents/skills/django-access-review/SKILL.md
    history: 1
    schedule: "0 8 15 * *"
    timezone: UTC

  # No schedule: choose Run now. It reviews the last week of commits.
  code-simplifier:
    name: Code simplifier
    skill: examples/code-simplifier/.agents/skills/code-simplifier/SKILL.md

  docs-drift:
    name: Documentation drift
    skill: examples/docs-drift/.agents/skills/docs-drift/SKILL.md
    history: 1
    schedule: "0 8 * * 1"
    timezone: UTC

  # Idea from Steve Ruiz: https://x.com/steveruizok/status/2116552016218710389
  implicit-state-machines:
    name: Implicit state machines
    skill: examples/implicit-state-machines/.agents/skills/implicit-state-machines/SKILL.md
    history: 1
    schedule: "0 8 1 * *"
    timezone: UTC

  engineering-briefing:
    name: Monday engineering briefing
    skill: examples/engineering-briefing/.agents/skills/engineering-briefing/SKILL.md
    schedule: "0 9 * * 1"
    timezone: Europe/Warsaw
    requires:
      mcps:
        - binding: github
          tools:
            - search_pull_requests
            - pull_request_read
            - list_commits
            - get_commit
    notify:
      - binding: engineering-reports
        required: true

  # A linked skill, pinned to the commit we tested. It files what it finds as
  # issues. Add fix-approved to one to queue it for the issue fixer.
  code-review:
    name: Code review
    skill: plugins/developer-essentials/skills/code-review-excellence/SKILL.md
    skill_source:
      repository: wshobson/agents
      ref: 42203085cfc5736204bf0f6d436dff7e1da0bf3f
    history: 3
    schedule: "0 8 22 * *"
    timezone: UTC
    open_issues:
      labels: [secondshift, code-review]
      max: 5
    # To find issues already filed, open or closed, before proposing one.
    requires:
      mcps:
        - binding: github
          tools:
            - search_issues
            - list_issues
            - issue_read

  # Fixes one issue labelled fix-approved per run and opens a draft pull
  # request. A maintainer adds the label after reading the issue.
  # The fullstack environment has Python 3.13 and Node 24, like CI, so the
  # agent can run the backend and dashboard checks. The server admin defines
  # it. See examples/issue-fixer/README.md.
  issue-fixer:
    name: Issue fixer
    skill: examples/issue-fixer/.agents/skills/issue-fixer/SKILL.md
    schedule: "0 7 * * 1-5"
    timezone: UTC
    history: 5
    open_pull_request: true
    hand_back:
      remove: [fix-approved]
      add: [needs-design]
    environment: fullstack
    setup:
      - python3 -m pip install --quiet --no-cache-dir --target .setup/uv uv
      - UV_LINK_MODE=copy .setup/uv/bin/uv sync --frozen --python /usr/local/bin/python3
      - cd dashboard && npm ci --ignore-scripts --no-audit --no-fund
    requires:
      mcps:
        - binding: github
          tools:
            - list_issues
            - issue_read
            - search_pull_requests
            - pull_request_read
