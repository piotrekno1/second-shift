name: CI

on:
  push:
    paths-ignore:
      - '**/README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Benchmark query budgets
        run: uv run pytest secondshift/benchmarks -o python_files='bench_*.py' --benchmark-disable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
