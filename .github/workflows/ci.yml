name: CI

on:
  push:
    paths-ignore:
      - '**/README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'

env:
  UV_LOCKED: "1"

permissions:
  contents: read

jobs:
  # The test jobs run the Makefile targets, so a local make check matches CI.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: make check-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - run: make check-frontend
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: make check-api-types

  # Fails if a workflow uses an action that is missing from actions.lock.
  # Run gh actions-lock after adding or changing an action.
  lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  # Audits workflows for security problems. Settings live in .github/zizmor.yml.
  zizmor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - run: uv run --locked --only-group zizmor --isolated zizmor --format github .
