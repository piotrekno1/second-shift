approval_policy = "never"
# Codex's own tools are off and must not write to this container. The run
# prompt tells the model that the broker's command tool can still write.
sandbox_mode = "read-only"
web_search = "disabled"

[features]
shell_tool = false
unified_exec = false
js_repl = false
code_mode = false
multi_agent = false
plugins = false
apps = false
computer_use = false
image_generation = false
apply_patch_freeform = false
# Start the turn only after the broker has listed its tools.
incremental_tools = false

# Some models ask for Codex's multi-agent tools, and their request wins over
# features.multi_agent. Only this setting removes the tools for every model.
# Codex sub-agents report no token usage, and nesting limits do not hold.
[agents]
enabled = false

# Codex sends usage metrics to ab.chatgpt.com, which the egress proxy refuses.
# Turn them off so a run doesn't make a call that is sure to fail.
[otel]
metrics_exporter = "none"
