version: "3"

environment:
  - SECONDSHIFT_ENV=dev
  # macOS kills forked workers that make outbound HTTP (system proxy lookup).
  - OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES

processes:
  stack:
    description: PostgreSQL is healthy
    command: docker compose -f docker-compose.localdev.yml up -d --wait

  stack_logs:
    description: Docker service logs
    command: docker compose -f docker-compose.localdev.yml logs --follow
    depends_on:
      stack:
        condition: process_completed_successfully
    shutdown:
      command: docker compose -f docker-compose.localdev.yml down
      timeout_seconds: 30

  initialize:
    description: Initialize the control plane, development workspace, and runner
    command: >-
      uv run python manage.py migrate &&
      uv run python manage.py bootstrap_dev &&
      DJANGO_SETTINGS_MODULE=secondshift.config.settings.runner uv run python manage.py migrate
    depends_on:
      stack:
        condition: process_completed_successfully

  runner:
    description: Isolated command-runner API
    command: uv run gunicorn --reload
    environment:
      - SECONDSHIFT_SERVICE=runner
      - SECONDSHIFT_HTTP_BIND=127.0.0.1:8002
      - SECONDSHIFT_HTTP_PROCESSES=1
    depends_on:
      initialize:
        condition: process_completed_successfully
    availability:
      restart: always

  backend:
    command: uv run gunicorn --reload
    environment:
      - SECONDSHIFT_SERVICE=web
      - SECONDSHIFT_HTTP_BIND=127.0.0.1:8000
    depends_on:
      initialize:
        condition: process_completed_successfully
    availability:
      restart: always

  gateway:
    description: Model gateway for the trusted agent orchestrator
    command: uv run gunicorn --reload
    environment:
      - SECONDSHIFT_SERVICE=gateway
      - SECONDSHIFT_HTTP_GRACEFUL_TIMEOUT_SECONDS=600
      - SECONDSHIFT_HTTP_BIND=127.0.0.1:8001
      - SECONDSHIFT_HTTP_PROCESSES=1
    depends_on:
      initialize:
        condition: process_completed_successfully
    availability:
      restart: always

  worker:
    command: uv run python manage.py run_dbos_worker
    environment:
      - SECONDSHIFT_SERVICE=worker
    depends_on:
      initialize:
        condition: process_completed_successfully
      gateway:
        condition: process_started
      runner:
        condition: process_started
    availability:
      restart: always
    watch:
      debounce: 500ms
      paths:
        - path: secondshift
          include: ["**/*.py"]

  frontend:
    command: npm run dev
    working_dir: dashboard
    depends_on:
      backend:
        condition: process_started

  docs:
    description: Public landing page and documentation at http://127.0.0.1:4321
    command: npm run dev
    working_dir: docs
